apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infergrid-llm
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: infergrid
spec:
  groups:
    - name: infergrid.llm
      interval: 15s
      rules:
        - record: llm_queue_depth
          expr: |
            label_replace(
              vllm:num_requests_waiting
              or vllm_num_requests_waiting
              or nv_trt_llm_inflight_batcher_metrics_total_num_queue_requests
              or 0 * kube_pod_info,
              "deployment", "$1", "pod", "^(.*)-[a-z0-9]+-[a-z0-9]+$"
            )
        - record: llm_kv_cache_usage
          expr: |
            vllm:kv_cache_usage_perc
            or vllm_kv_cache_usage_perc
            or nv_trt_llm_kv_cache_block_metrics_used_percentage
        - record: llm_requests_running
          expr: |
            vllm:num_requests_running
            or vllm_num_requests_running
        - alert: InfergridQueueNotDraining
          expr: llm_queue_depth > 8
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Queue depth is above the scale-out threshold
        - alert: InfergridKvCacheNearFull
          expr: llm_kv_cache_usage > 0.95
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: KV cache usage above 95 percent
        - alert: InfergridIdleGpu
          expr: |
            count(DCGM_FI_DEV_GPU_UTIL) > 0
            and sum(rate(infergrid_gateway_requests_total[30m])) == 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: GPU node is up with zero gateway traffic
        - alert: InfergridHighErrorRate
          expr: |
            sum(rate(infergrid_gateway_errors_total[5m]))
            /
            clamp_min(sum(rate(infergrid_gateway_requests_total[5m])), 1e-6) > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Gateway error rate above 1 percent
