name: bench

on:
  workflow_dispatch:
    inputs:
      config:
        description: Bench config under bench/configs
        default: vllm-fp16-c32-chat.yaml

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyyaml
      - name: Render placeholder result
        run: python bench/run_bench.py --config "bench/configs/${{ inputs.config }}" --commit "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/*.json
