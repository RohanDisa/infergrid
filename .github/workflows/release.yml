name: release

on:
  push:
    tags:
      - "v*"

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build only (push is Phase 9)
        run: |
          docker build -t infergrid/gateway:${GITHUB_REF_NAME} gateway
          docker build -t infergrid/mock-backend:${GITHUB_REF_NAME} mock-backend
          echo "Push to Artifact Registry after Workload Identity Federation is configured."
