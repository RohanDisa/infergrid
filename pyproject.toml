[project]
name = "infergrid"
version = "0.1.0"
description = "Cloud-native LLM serving platform on Kubernetes (vLLM + Triton/TensorRT-LLM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Infergrid" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "prometheus-client>=0.21.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["gateway", "mock-backend"]
include = ["app*", "mock_app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["gateway", "mock-backend", "."]
testpaths = [
    "gateway/tests",
    "mock-backend/tests",
    "bench/tests",
    "model_prep/tests",
    "clients/tests",
    "edge/tests",
]
norecursedirs = [".git", ".venv", "charts", "infra"]
consider_namespace_packages = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["gateway", "mock-backend", "bench", "model_prep", "clients", "edge", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "mock_app", "bench", "model_prep", "clients", "edge"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
mypy_path = "gateway:mock-backend"
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*", "mock_app.*", "bench.*"]
strict = false
disallow_untyped_defs = false
