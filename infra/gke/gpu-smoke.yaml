apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-smoke
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      containers:
        - name: smi
          image: nvidia/cuda:12.6.3-base-ubuntu22.04
          command: ["nvidia-smi"]
          resources:
            limits:
              nvidia.com/gpu: 1
